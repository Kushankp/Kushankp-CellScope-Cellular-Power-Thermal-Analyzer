[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cellscope-dashboard"
version = "0.1.0"
description = "Python visualization utilities for CellScope reports"
requires-python = ">=3.12"
dependencies = [
  "plotly>=5.22",
  "matplotlib>=3.9",
  "pandas>=2.2",
  "pytest>=8.2",
]

[project.scripts]
cellscope-dashboard = "cellscope.dashboard:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
